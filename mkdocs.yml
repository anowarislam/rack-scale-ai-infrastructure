site_name: Rack-scale AI infrastructure
site_description: A theory-first course in AI systems, workload platforms, and fleet operations.
site_url: https://anowarislam.github.io/rack-scale-ai-infrastructure/
repo_url: https://github.com/anowarislam/rack-scale-ai-infrastructure
repo_name: Course source
edit_uri: ''
docs_dir: .cache/pages-docs
site_dir: .cache/pages-site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  # No linear footer: the two platform tracks are alternatives. The builder
  # supplies course-map-aware Previous/Next links in each teaching chapter.

plugins:
  - search

hooks:
  - tools/build_pages.py

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/course.css

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Course home: index.md
  - Start here:
      - Learning guide: Learning-Guide.md
      - Study calendar: Study-Calendar.md
      - Fundamentals bridge: 00-Fundamentals-Bridge.md
