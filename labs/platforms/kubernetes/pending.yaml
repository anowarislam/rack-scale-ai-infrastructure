apiVersion: v1
kind: Pod
metadata:
  name: pending-example
  namespace: course-platform
spec:
  restartPolicy: Never
  serviceAccountName: reader
  nodeSelector:
    course.rack: course-invalid
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: calculate
      image: python:3.12.7-alpine3.20@sha256:5049c050bdc68575a10bcb1885baa0689b6c15152d8a56a7e399fb49f783bf98
      command: ["python3", "-c", "print(sum(i*i for i in range(1,13)))"]
      resources:
        requests: {cpu: 100m, memory: 32Mi}
        limits: {cpu: 500m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
