apiVersion: v1
kind: Namespace
metadata:
  name: course-platform
  labels:
    course.owner: rack-scale-course
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: course-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-reader
  namespace: course-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-reader
  namespace: course-platform
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: course-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-reader
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: course-budget
  namespace: course-platform
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "12"
    persistentvolumeclaims: "1"
    requests.storage: 64Mi
