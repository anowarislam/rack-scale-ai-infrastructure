# Dedicated, single-node CPU learning VM only. See runbook.md before use.
ClusterName=rack-course
SlurmctldHost=course-node
SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge
StateSaveLocation=/var/lib/slurm-course/controller
SlurmdSpoolDir=/var/lib/slurm-course/worker
SlurmctldLogFile=/var/log/slurm-course/controller.log
SlurmdLogFile=/var/log/slurm-course/worker.log
SlurmctldPidFile=/run/slurm-course/controller.pid
SlurmdPidFile=/run/slurm-course/worker.pid
SlurmctldPort=6817
SlurmdPort=6818
SlurmctldTimeout=120
SlurmdTimeout=120
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
PriorityType=priority/basic
ProctrackType=proctrack/linuxproc
# TaskPlugin and JobAcctGatherType are intentionally unset (25.05.3 defaults).
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm-course/job-completion.log
JobRequeue=1
ReturnToService=1
# AccountingStorageType is deliberately unset: no SlurmDBD history or fair share.
# Replace this one hardware line with measured slurmd -C values; see runbook.
NodeName=course-node CPUs=2 Boards=1 SocketsPerBoard=1 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=1024 State=UNKNOWN
PartitionName=cpu Nodes=course-node Default=YES MaxTime=00:10:00 State=UP OverSubscribe=NO
